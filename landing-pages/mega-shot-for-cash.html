            /* Form Container Box */
            .form-card,

                position: relative;
                z-index: 2;
                width: 100%;

            /* Form Header with Red Accent Bar */
            .form-header {
                display: flex;

                margin-bottom: 35px;

            .red-bar {
                width: 3.5px;

            .header-text h2 {

            .form-grid {

            .offerings-section {

            .offering-card {

                border-color: #990500;

                box-shadow: inset 0 0 12px rgba(225, 6, 0, 0.2);

            /* GHL Form Builder Checkbox Classes (Button Card Styles) */
            .option-checkbox-bubble {

            }

            }

            .bubble-checkbox-label.bubble-checkbox-container {
                display: flex !important;
                align-items: center !important;
                justify-content: flex-start !important;

            .bubble-checkbox-label.bubble-checkbox-container:hover {
                border-color: rgba(225, 6, 0, 0.8) !important;
                background: rgba(40, 10, 10, 0.6) !important;
            }

            /* Hide raw browser checkbox inside button card or style checked state */
            .bubble-checkbox-label.bubble-checkbox-container input[type="checkbox"] {
                margin-right: 10px !important;
                accent-color: #e10600 !important;
                width: 16px !important;
                height: 16px !important;
            }

            .bubble-checkbox-label.bubble-checkbox-container:has(input:checked) {
                border-color: #e10600 !important;
                background: rgba(120, 10, 10, 0.35) !important;
                box-shadow: 0 0 10px rgba(225, 6, 0, 0.3) !important;
            }


            /* Consent Checkbox */
            .consent-group {
                margin-bottom: 32px;
            }

            .checkbox-container {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                cursor: pointer;
                position: relative;
            }

            .checkbox-container input[type="checkbox"] {
                position: absolute;
                opacity: 0;
                cursor: pointer;
                height: 0;
                width: 0;
            }

            .checkmark {
                width: 18px;
                height: 18px;
                border: 1.5px solid rgba(255, 255, 255, 0.7);
                border-radius: 2px;
                flex-shrink: 0;
                margin-top: 2px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: transparent;
                transition: all 0.2s ease;
            }

            .checkbox-container input:checked~.checkmark {
                background: #e10600;
                border-color: #e10600;
            }

            .checkmark:after {
                content: '';
                width: 5px;
                height: 9px;
                border: solid white;
                border-width: 0 2px 2px 0;
                transform: rotate(45deg);
                margin-top: -2px;
                display: none;
            }

            .checkbox-container input:checked~.checkmark:after {
                display: block;
            }

            .consent-text {
                font-size: 11.5px;
                color: #bbbbbb;
                line-height: 1.45;
            }

            .consent-text a {
                color: #0099ff;
                text-decoration: none;
            }

            .consent-text a:hover {
                text-decoration: underline;
            }

            /* Submit Button */
            .btn-submit-giveaway {
                width: 100%;
                background-color: #e10600;
                color: #ffffff;
                font-family: 'Orbitron', 'Montserrat', sans-serif;
                font-size: 18px;
                font-weight: 900;
                text-transform: uppercase;
                padding: 18px 0;
                border: none;
                border-radius: 2px;
                cursor: pointer;
                letter-spacing: 1.5px;
                transition: all 0.3s ease;
                box-shadow: 0 5px 20px rgba(225, 6, 0, 0.45);

            .btn-submit-giveaway:hover {

                transform: translateY(-2px);

            .embed-toggle-bar {
                margin-top: 15px;

            .embed-toggle-btn {
                background: transparent;
                border: none;
                color: #888;
                font-size: 11px;
                text-decoration: underline;
                cursor: pointer;
            }


            /* Checbox Customize Button */

            /* Prize Banner Section */
            .prize-banner-section {
                width: 100%;
                background-color: #050505;
                line-height: 0;
                overflow: hidden;
            }

            .prize-banner-img {
                width: 100%;

                display: block;

            }

            /* Campaign Details Section */
            .campaign-details-section {
                position: relative;

                padding: 60px 20px 80px 20px;
                display: flex;
                flex-direction: column;

            .read-more-wrapper {
                margin-top: 59px;
                text-align: center;
            }

            .read-more-btn {
                display: inline-block;
                transition: transform 0.2s ease, opacity 0.2s ease;
                cursor: pointer;
            }

            .read-more-btn:hover {
                transform: translateY(-2px);
                opacity: 0.9;
            }

            .read-more-btn img {
                max-width: 100%;
                height: auto;
                display: block;
                margin: 0 auto;
            }

            /* Scroll To Top Button with Floating Bubble Effect */
            .scroll-to-top-btn {
                position: absolute;
                bottom: 90px;
                right: 40px;
                width: 50px;
                height: 50px;
                background: transparent;
                border: none;
                border-radius: 50%;
                cursor: pointer;
                z-index: 10;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                animation: bubbleFloat 3s ease-in-out infinite;
                outline: none;
                filter: drop-shadow(0 0 8px rgba(225, 6, 0, 0.4));
            }

            .scroll-to-top-btn:hover {
                transform: translateY(-6px) scale(1.15);
                filter: drop-shadow(0 0 18px rgba(225, 6, 0, 0.85));
                animation-play-state: paused;
            }

            .scroll-to-top-btn:active {
                transform: scale(0.92);
            }

            .scroll-to-top-btn img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
                transition: transform 0.3s ease;
            }

            @keyframes bubbleFloat {

                0%,
                100% {
                    transform: translateY(0);
                    filter: drop-shadow(0 0 8px rgba(225, 6, 0, 0.3));
                }

                50% {
                    transform: translateY(-10px);
                    filter: drop-shadow(0 0 16px rgba(225, 6, 0, 0.65));
                }
            }

            /* Responsive Styles */
            @media (max-width: 1199px) {

                }

                    max-width: 550px;
                    margin: 30px auto 0 auto;
                }

                .popup {
                    width: 92%;
                    max-width: 450px;
                }

            /* Tablet Landscape Support (768px - 1024px in landscape orientation) */
            @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
                .desktop-video {
                    display: block !important;

                .mobile-video {
                    display: none !important;
                }
            }

            @media (max-width: 768px) {

                    padding: 0;

                }

                .scroll-to-top-btn {
                    bottom: 20px;
                    right: 20px;
                    width: 42px;
                    height: 42px;
                }
            }

            @media (max-width: 576px) {

                    padding: 0;
                }

                }

                }

                .read-more-btn img {
                    max-width: 88%;
                }

                .popup {
                    width: 95%;
                    max-width: 360px;
                }

        // Smooth Scroll to Top
        document.getElementById('scrollToTopBtn')?.addEventListener('click', function () {

            });

        // Click anywhere on video section in mobile/tablet portrait view to scroll to form
        (function initVideoScroll() {
            function scrollToForm() {
                const isMobileOrPortrait = window.innerWidth <= 991 && !(window.innerWidth >= 768 && window.innerWidth <= 1024 && window.matchMedia('(orientation: landscape)').matches);
                if (!isMobileOrPortrait) return;

                const formSection = document.getElementById('formSection');
                if (formSection) {
                    formSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            function attachVideoListeners() {
                const wrapper = document.querySelector('.hero-bg-video-wrapper');
                if (!wrapper) return;

                // Attach listener to wrapper and all videos inside wrapper
                const targets = [wrapper, ...wrapper.querySelectorAll('video')];
                targets.forEach(el => {
                    el.removeEventListener('click', scrollToForm);
                    el.addEventListener('click', scrollToForm);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', attachVideoListeners);
            } else {
                attachVideoListeners();
            }
        })();
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const popupOverlay = document.getElementById('popupOverlay');
            const closeBtn = document.getElementById('closeButton');

            if (!popupOverlay) return;

            // Show popup on page load
            setTimeout(() => {
                popupOverlay.classList.add('show');
            }, 300);

            // Close button listener
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    popupOverlay.classList.remove('show');
                });
            }

            // Close when clicking overlay backdrop
            popupOverlay.addEventListener('click', (e) => {
                if (e.target === popupOverlay) {
                    popupOverlay.classList.remove('show');
                }
            });
        });
    </script>
