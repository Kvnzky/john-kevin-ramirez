      <!-- Canvas Confetti Library -->
      <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

      <script>
          var confettiLaunching = false;

          function launchConfetti() {
              if (confettiLaunching) return;
              confettiLaunching = true;
              setTimeout(function () { confettiLaunching = false; }, 4000);

              var colors = ['#e10600', '#ffffff', '#ffd700', '#ff2d20', '#ff8580'];

              function fireCanvasConfetti() {
                  // Center burst
                  confetti({
                      particleCount: 100,
                      spread: 80,
                      origin: { y: 0.6 },
                      colors: colors,
                      zIndex: 1000001
                  });

                  // Side cannons continuous shower for 2.5 seconds
                  var end = Date.now() + 2500;
                  (function frame() {
                      confetti({
                          particleCount: 3,
                          angle: 60,
                          spread: 55,
                          origin: { x: 0, y: 0.65 },
                          colors: colors,
                          zIndex: 1000001
                      });
                      confetti({
                          particleCount: 3,
                          angle: 120,
                          spread: 55,
                          origin: { x: 1, y: 0.65 },
                          colors: colors,
                          zIndex: 1000001
                      });

                      if (Date.now() < end) {
                          requestAnimationFrame(frame);
                      }
                  }());
              }

              function fallbackConfetti() {
                  var canvas = document.createElement('canvas');
                  canvas.style.position = 'fixed';
                  canvas.style.top = '0';
                  canvas.style.left = '0';
                  canvas.style.width = '100vw';
                  canvas.style.height = '100vh';
                  canvas.style.pointerEvents = 'none';
                  canvas.style.zIndex = '1000001';
                  document.body.appendChild(canvas);
                  var ctx = canvas.getContext('2d');
                  canvas.width = window.innerWidth;
                  canvas.height = window.innerHeight;

                  var particles = [];
                  for (var i = 0; i < 120; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height * 0.5,
                        size: Math.random() * 8 + 4,
                        speedY: Math.random() * 3 + 2,
                        speedX: Math.random() * 2 - 1,
                        angle: Math.random() * 360,
                        rotSpeed: Math.random() * 6 - 3,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }

                var start = Date.now();
                function step() {
                    if (Date.now() - start > 3500) {
                        canvas.remove();
                        return;
                    }
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(function (p) {
                        p.y += p.speedY;
                        p.x += p.speedX;
                        p.angle += p.rotSpeed;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.angle * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                        ctx.restore();
                    });
                    requestAnimationFrame(step);
                }
                step();
            }

            if (typeof confetti === 'function') {
                fireCanvasConfetti();
            } else {
                var retries = 0;
                var interval = setInterval(function () {
                    retries++;
                    if (typeof confetti === 'function') {
                        clearInterval(interval);
                        fireCanvasConfetti();
                    } else if (retries >= 15) {
                        clearInterval(interval);
                        fallbackConfetti();
                    }
                }, 100);
            }
        }
    </script>

          // Override launchConfetti immediately (before DOMContentLoaded fires)
          // so the original script cannot call it unless we allow it
          if (formClosed.trim().toLowerCase() !== "true") {

          }

              if (formClosed.trim().toLowerCase() === "true") {
                  setTimeout(() => {
                      popupOverlay.classList.add('show');
                      launchConfetti();
                  }, 1000);

                  popupOverlay.style.display = 'none';
              }
          });
